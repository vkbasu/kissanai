[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-farmer-scheme-assistant"
version = "5.2.0"
description = "Helps Indian farmers find government schemes using live website/PDF scraping, 3D globe map, and offline neural TTS."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "pypdf>=4.0.0",
  "pyttsx3>=2.90",
  "edge-tts>=7.0.0",
]

[project.optional-dependencies]
offline-tts = ["sherpa-onnx>=1.10.0"]

[project.scripts]
smart-farmer = "app.main:run"

[tool.setuptools.packages.find]
include = ["app*", "ai_service*", "scripts*"]
